x-app: &app
  image: distraction-blocker-dev:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  working_dir: /workspace
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
  environment:
    CHOKIDAR_USEPOLLING: "true"
    CHOKIDAR_INTERVAL: "500"

services:
  app:
    <<: *app
    profiles: ["tools"]
    command: ["npm", "run", "build"]

  dev:
    <<: *app
    command: ["npm", "run", "dev"]

volumes:
  node_modules:
